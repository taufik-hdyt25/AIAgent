services:
  telegram-coding-agent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: telegram-coding-agent
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-3030}:${WEB_PORT:-3030}"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - WEB_PORT=${WEB_PORT:-3030}
      - PI_BIN=/usr/local/bin/pi
      - PROJECTS_DIR=/home/node/projects
      - PROJECTS_FILE=/app/data/projects.json
      - TASK_TIMEOUT_MS=${TASK_TIMEOUT_MS:-900000}
      - MAX_TASK_OUTPUT=${MAX_TASK_OUTPUT:-12000}
    extra_hosts:
      # Agar container bisa menjangkau CLIProxyAPI yang berjalan di host
      - "host.docker.internal:host-gateway"
    volumes:
      # Data konfigurasi dan status project
      - ./data:/app/data
      # Log aktivitas task
      - ./logs:/app/logs
      # Folder kerja repositori di host (hasil coding AI langsung tersimpan di host)
      - ../projects:/home/node/projects
      # File dan gambar yang diunggah dari chat Telegram
      - ./uploads:/app/uploads
      # Persistensi konfigurasi Pi CLI (~/.pi/agent/models.json)
      - ./pi_config:/home/node/.pi
      # Akses Docker daemon host (DooD)
      - /var/run/docker.sock:/var/run/docker.sock
      # Source code mount
      - ./src:/app/src

    security_opt:
      - no-new-privileges:true
