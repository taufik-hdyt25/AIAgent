<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TH Agent — 3D Virtual Office</title>
  <style>
    :root {
      --bg: #121826;
      --panel: rgba(15, 23, 42, 0.72);
      --border: rgba(255, 255, 255, 0.14);
      --text: #f1f5f9;
      --muted: #94a3b8;
      --cyan: #38bdf8;
      --blue: #60a5fa;
      --pink: #f472b6;
      --emerald: #34d399;
      --amber: #facc15;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, sans-serif; }
    #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
    #labels { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
    .name-pill {
      position: absolute; transform: translate(-50%, -100%);
      background: rgba(15, 23, 42, 0.82); border: 1px solid rgba(255,255,255,0.16);
      backdrop-filter: blur(8px); border-radius: 999px; padding: 4px 11px;
      font-size: 11.5px; font-weight: 600; white-space: nowrap;
      display: inline-flex; align-items: center; gap: 6px;
      pointer-events: auto; cursor: pointer;
      box-shadow: 0 6px 18px rgba(0,0,0,0.32);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .name-pill:hover { transform: translate(-50%, -110%) scale(1.04); border-color: var(--cyan); }
    .name-pill.working { border-color: rgba(52, 211, 153, 0.75); background: rgba(6, 78, 59, 0.85); }
    .done-float {
      position: absolute; left: 50%; bottom: calc(100% + 6px); transform: translateX(-50%);
      background: #10b981; color: #052e16; font-weight: 800; font-size: 11px;
      padding: 2px 8px; border-radius: 999px; pointer-events: none;
      animation: floatDone 2.2s ease-out forwards;
    }
    @keyframes floatDone {
      0% { opacity: 0; transform: translate(-50%, 4px) scale(0.8); }
      18% { opacity: 1; transform: translate(-50%, -6px) scale(1.05); }
      100% { opacity: 0; transform: translate(-50%, -26px) scale(0.95); }
    }
    .name-pill .hover-tip {
      display: none; position: absolute; left: 50%; bottom: calc(100% + 8px); transform: translateX(-50%);
      background: rgba(10, 15, 28, 0.94); border: 1px solid rgba(56, 189, 248, 0.35);
      border-radius: 10px; padding: 7px 10px; min-width: 190px; max-width: 260px;
      white-space: normal; text-align: left; font-weight: 400; font-size: 11px; line-height: 1.4;
      color: #cbd5e1; box-shadow: 0 10px 28px rgba(0,0,0,0.45); pointer-events: none; z-index: 40;
    }
    .name-pill:hover .hover-tip, .name-pill.hovered .hover-tip { display: block; }
    .hover-tip .ht-model { font-family: ui-monospace, monospace; font-size: 10px; color: #38bdf8; margin-bottom: 3px; }
    .hover-tip .ht-task { color: #e2e8f0; }
    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; flex-shrink: 0; }

    .topbar {
      position: fixed; top: 14px; left: 14px; right: 14px; z-index: 20;
      display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
      pointer-events: none;
    }
    .topbar > * { pointer-events: auto; }
    .pill-bar {
      display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
      background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(12px);
      padding: 8px 14px; border-radius: 12px;
    }
    .brand { font-weight: 700; font-size: 14px; display: flex; align-items: center; gap: 8px; }
    .chip { font-size: 11px; padding: 4px 9px; border-radius: 999px; border: 1px solid var(--border); background: rgba(255,255,255,0.06); color: #cbd5e1; font-family: ui-monospace, monospace; }
    .btn-link {
      font-size: 12px; font-weight: 600; color: var(--text); text-decoration: none;
      background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(12px);
      padding: 8px 12px; border-radius: 10px; cursor: pointer; transition: border-color 0.2s;
    }
    .btn-link:hover { border-color: var(--cyan); }

    .side-panel {
      position: fixed; top: 70px; right: 14px; width: 300px; max-height: calc(100vh - 175px);
      display: flex; flex-direction: column; gap: 10px; z-index: 20; pointer-events: none;
    }
    .card {
      pointer-events: auto; background: var(--panel); border: 1px solid var(--border);
      backdrop-filter: blur(12px); border-radius: 12px; padding: 12px;
    }
    .card h3 { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 8px; }
    .feed { display: flex; flex-direction: column; gap: 6px; max-height: 200px; overflow-y: auto; font-size: 11px; }
    .feed-item { padding: 6px 8px; border-radius: 8px; background: rgba(255,255,255,0.04); border-left: 2px solid var(--cyan); line-height: 1.35; }
    .feed-item.writer { border-left-color: var(--pink); }
    .feed-item.coder { border-left-color: var(--blue); }
    .feed-item.sentry { border-left-color: var(--emerald); }

    .command-dock {
      position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%);
      width: min(780px, calc(100vw - 28px)); z-index: 25;
      display: flex; flex-direction: column; gap: 8px;
    }
    .reply-drawer {
      background: rgba(15, 23, 42, 0.92); border: 1px solid rgba(56, 189, 248, 0.35);
      backdrop-filter: blur(14px); border-radius: 12px; padding: 12px 14px;
      max-height: 210px; overflow-y: auto; font-size: 12.5px; line-height: 1.5; display: none;
    }
    .reply-drawer.open { display: block; }
    .reply-meta { font-size: 11px; color: var(--cyan); font-weight: 600; margin-bottom: 6px; display: flex; justify-content: space-between; }
    .cmd-bar {
      display: flex; gap: 8px; align-items: center;
      background: var(--panel); border: 1px solid var(--border); backdrop-filter: blur(14px);
      padding: 8px; border-radius: 14px; box-shadow: 0 12px 32px rgba(0,0,0,0.4);
    }
    .cmd-select {
      background: rgba(15, 23, 42, 0.85); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 9px 10px; font-size: 12px; font-weight: 600; outline: none;
    }
    .cmd-input {
      flex: 1; background: rgba(15, 23, 42, 0.65); color: var(--text); border: 1px solid var(--border);
      border-radius: 9px; padding: 10px 12px; font-size: 13px; outline: none;
    }
    .cmd-input:focus { border-color: var(--cyan); }
    .cmd-btn {
      background: linear-gradient(135deg, #0284c7, #10b981); color: #fff; border: none;
      border-radius: 9px; padding: 10px 16px; font-size: 12px; font-weight: 700; cursor: pointer;
    }
    .cmd-btn:disabled { opacity: 0.55; cursor: wait; }

    @media (max-width: 760px) {
      .side-panel { display: none; }
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://esm.sh/three@0.170.0",
        "three/addons/": "https://esm.sh/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels"></div>

  <div class="topbar">
    <div class="pill-bar">
      <div class="brand">🏢 TH Studio — 3D Virtual Office</div>
      <span class="chip" id="chipVps">VPS: memuat...</span>
      <span class="chip" id="chipRouter">Router: Auto</span>
    </div>
    <div style="display:flex; gap:8px;">
      <button type="button" id="btnSound" class="btn-link">🔊 Sound: ON</button>
      <a href="/chat.html" class="btn-link">💬 Chat</a>
      <a href="/index.html" class="btn-link">⚙️ Web Settings</a>
    </div>
  </div>

  <div class="side-panel">
    <div class="card">
      <h3>Inspektur Agent</h3>
      <div id="inspectorBody" style="font-size:12px; line-height:1.5; color:#cbd5e1;">
        Klik nama atau karakter 3D untuk melihat detail peran &amp; modelnya.
      </div>
    </div>
    <div class="card">
      <h3>Aktivitas Kantor Live</h3>
      <div class="feed" id="activityFeed">
        <div class="feed-item">Memuat aktivitas kantor...</div>
      </div>
    </div>
  </div>

  <div class="command-dock">
    <div class="reply-drawer" id="replyDrawer">
      <div class="reply-meta">
        <span id="replyMeta">CEO → Delegasi</span>
        <button type="button" onclick="document.getElementById('replyDrawer').classList.remove('open')" style="background:none;border:none;color:#94a3b8;cursor:pointer;">✕ Tutup</button>
      </div>
      <pre id="replyText" style="white-space:pre-wrap;font-family:inherit;"></pre>
    </div>
    <form class="cmd-bar" id="cmdForm">
      <select id="cmdTarget" class="cmd-select">
        <option value="auto">👑 CEO (Auto)</option>
        <option value="coder">💻 Coder</option>
        <option value="writer">✍️ Writer</option>
      </select>
      <input id="cmdInput" class="cmd-input" placeholder="Beri perintah ke CEO sebagai Owner / Orkestrator..." autocomplete="off" />
      <button type="submit" id="cmdBtn" class="cmd-btn">Kirim Misi</button>
    </form>
  </div>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";

    const canvas = document.getElementById("scene");
    const labelsRoot = document.getElementById("labels");
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: "high-performance" });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;

    const scene = new THREE.Scene();

    // Warm sunset/twilight city sky background
    const skyCanvas = document.createElement("canvas");
    skyCanvas.width = 32; skyCanvas.height = 512;
    const sctx = skyCanvas.getContext("2d");
    const grad = sctx.createLinearGradient(0, 0, 0, 512);
    grad.addColorStop(0.0, "#0f172a");
    grad.addColorStop(0.45, "#1e293b");
    grad.addColorStop(0.78, "#334155");
    grad.addColorStop(1.0, "#1e1b4b");
    sctx.fillStyle = grad;
    sctx.fillRect(0, 0, 32, 512);
    const skyTex = new THREE.CanvasTexture(skyCanvas);
    skyTex.colorSpace = THREE.SRGBColorSpace;
    scene.background = skyTex;
    scene.fog = new THREE.FogExp2(0x162033, 0.012);

    const camera = new THREE.PerspectiveCamera(44, window.innerWidth / window.innerHeight, 0.1, 120);
    camera.position.set(0, 9.8, 14.2);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.rotateSpeed = 0.65;
    controls.zoomSpeed = 0.8;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 6.5;
    controls.maxDistance = 24;
    controls.target.set(0, 1.0, 0.2);

    // Warm Office Lighting
    scene.add(new THREE.HemisphereLight(0xe2e8f0, 0x334155, 1.05));
    const sunLight = new THREE.DirectionalLight(0xfff1d6, 1.55);
    sunLight.position.set(7, 13, 9);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.set(2048, 2048);
    sunLight.shadow.bias = -0.0005;
    scene.add(sunLight);

    const warmFill = new THREE.PointLight(0xfbbf24, 1.3, 18);
    warmFill.position.set(-5, 4.2, 2);
    scene.add(warmFill);

    const coolFill = new THREE.PointLight(0x38bdf8, 1.2, 18);
    coolFill.position.set(5, 4.2, -1);
    scene.add(coolFill);

    // Warm Wooden Office Floor + Carpet
    const floor = new THREE.Mesh(
      new THREE.BoxGeometry(20, 0.3, 15),
      new THREE.MeshStandardMaterial({ color: 0x3f3228, roughness: 0.72, metalness: 0.05 })
    );
    floor.position.set(0, -0.15, 0);
    floor.receiveShadow = true;
    scene.add(floor);

    const ceoRug = new THREE.Mesh(
      new THREE.BoxGeometry(6.4, 0.03, 4.2),
      new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.9 })
    );
    ceoRug.position.set(0, 0.015, -1.0);
    ceoRug.receiveShadow = true;
    scene.add(ceoRug);

    // Office Walls + Panoramic Window
    const wallMat = new THREE.MeshStandardMaterial({ color: 0x293548, roughness: 0.75 });
    const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4.6, 15), wallMat);
    leftWall.position.set(-10, 2.3, 0);
    leftWall.receiveShadow = true;
    scene.add(leftWall);

    const rightWall = new THREE.Mesh(new THREE.BoxGeometry(0.25, 4.6, 15), wallMat);
    rightWall.position.set(10, 2.3, 0);
    rightWall.receiveShadow = true;
    scene.add(rightWall);

    // Back wall with large glass window
    const backBottom = new THREE.Mesh(new THREE.BoxGeometry(20, 1.0, 0.25), wallMat);
    backBottom.position.set(0, 0.5, -7.4);
    const backTop = new THREE.Mesh(new THREE.BoxGeometry(20, 0.6, 0.25), wallMat);
    backTop.position.set(0, 4.3, -7.4);
    const backLeftPillar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.0, 0.25), wallMat);
    backLeftPillar.position.set(-8.7, 2.5, -7.4);
    const backRightPillar = new THREE.Mesh(new THREE.BoxGeometry(2.6, 3.0, 0.25), wallMat);
    backRightPillar.position.set(8.7, 2.5, -7.4);
    const glassPane = new THREE.Mesh(
      new THREE.PlaneGeometry(14.8, 2.8),
      new THREE.MeshPhysicalMaterial({ color: 0x7dd3fc, transparent: true, opacity: 0.16, roughness: 0.1, metalness: 0.1 })
    );
    glassPane.position.set(0, 2.5, -7.4);
    scene.add(backBottom, backTop, backLeftPillar, backRightPillar, glassPane);

    // City Skyline outside window
    const buildingMat = new THREE.MeshStandardMaterial({ color: 0x162032, roughness: 0.8 });
    const winMat = new THREE.MeshBasicMaterial({ color: 0xfde68a });
    for (let i = -14; i <= 14; i += 2.6) {
      const h = 3.5 + ((Math.abs(i * 17) % 5) * 1.1);
      const b = new THREE.Mesh(new THREE.BoxGeometry(1.8, h, 1.8), buildingMat);
      b.position.set(i, h / 2 - 0.5, -13 - (Math.abs(i) % 3) * 2.2);
      scene.add(b);
      const w = new THREE.Mesh(new THREE.PlaneGeometry(1.1, h * 0.55), winMat);
      w.position.set(i, h / 2, b.position.z + 0.92);
      w.material = new THREE.MeshBasicMaterial({ color: i % 2 === 0 ? 0xfde68a : 0x7dd3fc, transparent: true, opacity: 0.28 });
      scene.add(w);
    }

    // Office Furniture: Bookshelf, Whiteboard, Lounge Sofa & Coffee Table
    function addBookshelf(x, z, rotY = 0) {
      const g = new THREE.Group();
      const frame = new THREE.Mesh(new THREE.BoxGeometry(1.8, 2.4, 0.45), new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.7 }));
      frame.position.y = 1.2;
      frame.castShadow = true;
      g.add(frame);
      const colors = [0x38bdf8, 0xf472b6, 0x34d399, 0xfacc15];
      for (let row = 0; row < 3; row++) {
        for (let b = 0; b < 4; b++) {
          const book = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.36, 0.32), new THREE.MeshStandardMaterial({ color: colors[(row + b) % colors.length] }));
          book.position.set(-0.55 + b * 0.32, 0.65 + row * 0.65, 0.1);
          g.add(book);
        }
      }
      g.position.set(x, 0, z);
      g.rotation.y = rotY;
      scene.add(g);
    }
    addBookshelf(-9.5, -2.5, Math.PI / 2);
    addBookshelf(9.5, -2.5, -Math.PI / 2);

    // Kanban / Whiteboard on left wall
    const board = new THREE.Mesh(new THREE.BoxGeometry(0.08, 1.6, 2.8), new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.3 }));
    board.position.set(-9.8, 2.4, 1.8);
    scene.add(board);

    // Large Live Activity Board in front of the back panoramic window
    function createActivityWallBoard() {
      const canvasEl = document.createElement("canvas");
      canvasEl.width = 1024;
      canvasEl.height = 352;
      const ctx = canvasEl.getContext("2d");
      const tex = new THREE.CanvasTexture(canvasEl);
      tex.colorSpace = THREE.SRGBColorSpace;

      const group = new THREE.Group();
      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(6.6, 2.25, 0.12),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, roughness: 0.35, metalness: 0.6 })
      );
      const glowTrim = new THREE.Mesh(
        new THREE.BoxGeometry(6.7, 2.34, 0.06),
        new THREE.MeshBasicMaterial({ color: 0x38bdf8, transparent: true, opacity: 0.35 })
      );
      glowTrim.position.z = -0.02;
      const screen = new THREE.Mesh(
        new THREE.PlaneGeometry(6.36, 2.04),
        new THREE.MeshBasicMaterial({ map: tex })
      );
      screen.position.z = 0.07;

      const legMat = new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.7, roughness: 0.3 });
      for (const lx of [-2.9, 2.9]) {
        const leg = new THREE.Mesh(new THREE.CylinderGeometry(0.055, 0.055, 2.85, 12), legMat);
        leg.position.set(lx, -1.425, 0);
        group.add(leg);
      }
      group.add(glowTrim, frame, screen);
      group.position.set(0, 2.85, -6.7);
      scene.add(group);

      const roleColor = {
        coder: "#60a5fa",
        writer: "#f472b6",
        ceo: "#38bdf8",
        sentry: "#34d399",
      };

      function draw(events = [], meta = {}) {
        ctx.fillStyle = "#080f1e";
        ctx.fillRect(0, 0, 1024, 352);

        // Header bar
        ctx.fillStyle = "#0f172a";
        ctx.fillRect(0, 0, 1024, 58);
        ctx.fillStyle = "#38bdf8";
        ctx.fillRect(0, 56, 1024, 3);

        ctx.fillStyle = "#34d399";
        ctx.beginPath();
        ctx.arc(30, 29, 8, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 22px system-ui, sans-serif";
        ctx.fillText("TH STUDIO — LIVE ACTIVITY BOARD", 52, 37);

        const statsText = `RAM ${meta.ramUsedPct ?? "-"}%  |  LOAD ${meta.loadAvg ?? "-"}  |  UP ${meta.uptimeSec ? Math.floor(meta.uptimeSec / 60) + "m" : "-"}`;
        ctx.fillStyle = "#94a3b8";
        ctx.font = "16px monospace";
        ctx.textAlign = "right";
        ctx.fillText(statsText, 996, 35);
        ctx.textAlign = "left";

        const rows = Array.isArray(events) && events.length
          ? events.slice(0, 6)
          : [{ role: "ceo", text: "Menunggu aktivitas agent..." }];

        rows.forEach((ev, idx) => {
          const y = 78 + idx * 43;
          ctx.fillStyle = idx === 0 ? "rgba(56, 189, 248, 0.14)" : "rgba(30, 41, 59, 0.55)";
          ctx.fillRect(24, y, 976, 36);

          const accent = ev.type === "done" ? "#34d399" : (roleColor[ev.role] || "#38bdf8");
          ctx.fillStyle = accent;
          ctx.fillRect(24, y, 6, 36);

          const badge = (ev.role || "ceo").toUpperCase();
          ctx.fillStyle = accent;
          ctx.font = "bold 15px monospace";
          ctx.fillText(badge, 42, y + 23);

          ctx.fillStyle = "#e2e8f0";
          ctx.font = "17px system-ui, sans-serif";
          const cleanText = String(ev.text || "").slice(0, 82);
          ctx.fillText(cleanText, 128, y + 24);
        });

        tex.needsUpdate = true;
      }

      draw([], {});
      return { draw };
    }
    const activityBoard = createActivityWallBoard();

    // Lounge Sofa & Coffee Table on right side
    const sofaGroup = new THREE.Group();
    const sofaBase = new THREE.Mesh(new THREE.BoxGeometry(1.2, 0.45, 2.4), new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 }));
    sofaBase.position.y = 0.225;
    const sofaBack = new THREE.Mesh(new THREE.BoxGeometry(0.28, 0.85, 2.4), new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.8 }));
    sofaBack.position.set(0.46, 0.55, 0);
    sofaGroup.add(sofaBase, sofaBack);
    sofaGroup.position.set(8.6, 0, 2.2);
    scene.add(sofaGroup);

    const coffeeTable = new THREE.Mesh(new THREE.CylinderGeometry(0.55, 0.55, 0.42, 20), new THREE.MeshStandardMaterial({ color: 0x6b4f3b, roughness: 0.6 }));
    coffeeTable.position.set(7.2, 0.21, 2.2);
    coffeeTable.castShadow = true;
    scene.add(coffeeTable);

    // Potted office plants
    function addPlant(x, z) {
      const g = new THREE.Group();
      const pot = new THREE.Mesh(new THREE.CylinderGeometry(0.32, 0.24, 0.52, 12), new THREE.MeshStandardMaterial({ color: 0xe2e8f0, roughness: 0.5 }));
      pot.position.y = 0.26;
      const leaves = new THREE.Mesh(new THREE.DodecahedronGeometry(0.52, 1), new THREE.MeshStandardMaterial({ color: 0x10b981, roughness: 0.65 }));
      leaves.position.y = 0.86;
      leaves.castShadow = true;
      g.add(pot, leaves);
      g.position.set(x, 0, z);
      scene.add(g);
    }
    addPlant(-8.8, -6.2);
    addPlant(8.8, -6.2);
    addPlant(-8.8, 5.4);
    addPlant(8.8, 5.4);

    // Server rack for Sentry
    const rack = new THREE.Group();
    const rackBody = new THREE.Mesh(new THREE.BoxGeometry(1.1, 2.5, 0.85), new THREE.MeshStandardMaterial({ color: 0x1e293b, metalness: 0.5, roughness: 0.4 }));
    rackBody.position.y = 1.25;
    rackBody.castShadow = true;
    rack.add(rackBody);
    const leds = [];
    for (let i = 0; i < 6; i++) {
      const led = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.07, 0.05), new THREE.MeshBasicMaterial({ color: 0x34d399 }));
      led.position.set(0, 0.55 + i * 0.34, 0.44);
      rack.add(led);
      leds.push(led);
    }
    rack.position.set(2.4, 0, -5.4);
    scene.add(rack);

    // Stations & Characters
    const agents = {};
    const clickableMeshes = [];

    function createLiveScreenTexture(mode = "code") {
      const c = document.createElement("canvas");
      c.width = 256; c.height = 160;
      const ctx = c.getContext("2d");
      const tex = new THREE.CanvasTexture(c);
      tex.colorSpace = THREE.SRGBColorSpace;
      const codeLines = [
        "import { route } from './router';",
        "export async function run(task) {",
        "  const spec = classify(task);",
        "  if (spec === 'coder') {",

        ctx.fillStyle = "#090f1d";
        ctx.fillRect(0, 0, 256, 160);
        // Top window bar
        ctx.fillStyle = "#162033";
        ctx.fillRect(0, 0, 256, 16);
        for (const [bx, col] of [[10, "#ef4444"], [20, "#facc15"], [30, "#22c55e"]]) {
          ctx.fillStyle = col; ctx.beginPath(); ctx.arc(bx, 8, 3, 0, Math.PI * 2); ctx.fill();
        }
        if (mode === "sentry") {
          ctx.strokeStyle = "#34d399"; ctx.lineWidth = 2; ctx.beginPath();
          for (let x = 10; x < 246; x += 8) {
            const y = 86 + Math.sin(x * 0.08 + t * (isWorking ? 6 : 2.5)) * 22;
            if (x === 10) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
          ctx.fillStyle = "#34d399"; ctx.font = "bold 12px monospace";
          ctx.fillText("SYS OK | RAM LIVE", 14, 36);
        } else {
          const lines = mode === "writer" ? writerLines : codeLines;
          const speed = isWorking ? 2.4 : 0.45;
          scroll += speed * 0.04;
          ctx.font = "11px monospace";
          const startIdx = Math.floor(scroll) % lines.length;
          for (let i = 0; i < 8; i++) {
            const line = lines[(startIdx + i) % lines.length];
            const y = 34 + i * 16;
            const isLast = i === 7;
            const chars = isLast && isWorking ? Math.floor(((t * 18) % (line.length + 3))) : line.length;
            const txt = line.slice(0, chars);
            ctx.fillStyle = txt.startsWith("import") || txt.startsWith("export") || txt.startsWith("#") ? "#f472b6"

              ctx.fillStyle = "#38bdf8";
              ctx.fillRect(12 + ctx.measureText(txt).width, y - 9, 6, 11);
            }
          }
        }
        if (isDone) {
          ctx.fillStyle = "rgba(6, 78, 59, 0.82)";
          ctx.fillRect(46, 56, 164, 48);
          ctx.strokeStyle = "#34d399";
          ctx.lineWidth = 2;
          ctx.strokeRect(46, 56, 164, 48);
          ctx.fillStyle = "#a7f3d0";
          ctx.font = "bold 18px sans-serif";
          ctx.fillText("✓ DONE", 92, 86);
        }
        tex.needsUpdate = true;

    function playSoftChime() {
      if (!soundEnabled) return;
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const now = ctx.currentTime;
        for (const [freq, offset] of [[659.25, 0], [880, 0.11]]) {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "sine";
          osc.frequency.setValueAtTime(freq, now + offset);
          gain.gain.setValueAtTime(0.001, now + offset);
          gain.gain.exponentialRampToValueAtTime(0.08, now + offset + 0.02);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + offset + 0.35);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(now + offset); osc.stop(now + offset + 0.36);

      } catch {}

        agents.ceo.celebratingUntil = performance.now() + 1100;
        agents.ceo.lookTargetY = 0;
        showDoneBadge(agents.ceo);
        spawnDelegationArc(agents.ceo.posVec, new THREE.Vector3(0, 1.3, 5.1), 0xfacc15);
      }, 650);

      setTimeout(() => {
        worker.lookTargetY = 0;
        worker.state = "idle";
        worker.el.classList.remove("working");
      }, 2100);
    }

    function triggerTelegramIncoming() {
      const skySource = new THREE.Vector3(-2.5, 4.2, -5.8);
      spawnDelegationArc(skySource, agents.ceo.posVec, 0x38bdf8);
      agents.ceo.state = "working";
      agents.ceo.el.classList.add("working");
      spawnPulseRing(agents.ceo.posVec, 0x38bdf8);
    }

    function selectAgent(id) {
      if (id === "owner") {
        document.getElementById("inspectorBody").innerHTML = `
          <div style="font-weight:700;font-size:14px;margin-bottom:4px;">👑 Owner / Orkestrator</div>
          <div style="font-family:monospace;font-size:11px;color:#facc15;margin-bottom:6px;">VIP Executive Suite</div>
          <div>Status: <strong>ACTIVE COMMANDER</strong></div>
          <div style="margin-top:6px;color:#94a3b8;">Memberi misi &amp; mengorkestrasi CEO beserta tim spesialis.</div>
        `;
        return;
      }
      const a = agents[id];
      if (!a) return;
      document.getElementById("inspectorBody").innerHTML = `
        <div style="font-weight:700;font-size:14px;margin-bottom:4px;">${a.roleTitle}</div>
        <div style="font-family:monospace;font-size:11px;color:#38bdf8;margin-bottom:6px;">${a.modelLabel}</div>
        <div>Status: <strong>${a.state.toUpperCase()}</strong></div>
        <div style="margin-top:6px;color:#94a3b8;">Tugas terakhir:<br>${a.lastTask}</div>
      `;
    }
    selectAgent("ceo");

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    let lastHoveredId = null;
    canvas.addEventListener("mousemove", (ev) => {
      pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickableMeshes, false);
      const hitId = hits.length > 0 ? hits[0].object.userData.agentId : null;
      if (hitId !== lastHoveredId) {
        for (const a of Object.values(agents)) a.el.classList.remove("hovered");
        ownerLabel.classList.remove("hovered");
        if (hitId === "owner") ownerLabel.classList.add("hovered");
        else if (hitId && agents[hitId]) agents[hitId].el.classList.add("hovered");
        canvas.style.cursor = hitId ? "pointer" : "default";
        lastHoveredId = hitId;
      }
    });

    canvas.addEventListener("click", (ev) => {
      pointer.x = (ev.clientX / window.innerWidth) * 2 - 1;
      pointer.y = -(ev.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(pointer, camera);
      const hits = raycaster.intersectObjects(clickableMeshes, false);
      if (hits.length > 0 && hits[0].object.userData.agentId) {
        selectAgent(hits[0].object.userData.agentId);
      }
    });

    async function pollOfficeState() {
      try {
        const res = await fetch("/api/office/state", { cache: "no-store" });
        if (!res.ok) return;
        const data = await res.json();
        if (!data.ok || !data.office) return;
        const o = data.office;
        document.getElementById("chipVps").textContent = `RAM: ${o.ramUsedPct}% | Load: ${o.loadAvg}`;
        document.getElementById("chipRouter").textContent = o.autoSpecialist ? "Auto-Router: ON" : "Auto-Router: OFF";

        for (const key of ["ceo", "coder", "writer", "sentry"]) {
          const info = o.agents?.[key];
          const a = agents[key];
          if (!info || !a) continue;
          a.modelLabel = info.provider ? `${info.provider}/${info.model}` : info.model;
          if (info.lastTask) a.lastTask = info.lastTask;
          const htM = a.el.querySelector(".ht-model");
          const htT = a.el.querySelector(".ht-task");
          if (htM) htM.textContent = a.modelLabel;
          if (htT) htT.textContent = a.lastTask || "Standby";
          if (a.state !== "working") {
            a.state = info.status === "active" || info.status === "monitoring" ? "active" : "idle";
          }
          a.el.classList.toggle("working", a.state === "working");
        }

        activityBoard.draw(o.events || [], o);
        const feed = document.getElementById("activityFeed");
        if (Array.isArray(o.events) && o.events.length) {
          feed.innerHTML = o.events.map((e) => `<div class="feed-item ${e.role || ''}">${e.text}</div>`).join("");
          const latest = o.events[0];
          const latestKey = latest.key || latest.text;
          if (!window.__officeInitDone) {
            window.__lastEventKey = latestKey;
            window.__officeInitDone = true;
          } else if (latestKey !== window.__lastEventKey) {
            window.__lastEventKey = latestKey;
            if (latest.type === "telegram") triggerTelegramIncoming();
            else if (latest.type === "route" || latest.type === "studio") triggerCeoDelegation(latest.role || "coder");
            else if (latest.type === "done") triggerTaskComplete(latest.role || "coder");
          }
        }
      } catch {}
    }
    pollOfficeState();
    setInterval(pollOfficeState, 2500);

    const cmdForm = document.getElementById("cmdForm");
    const cmdInput = document.getElementById("cmdInput");
    const cmdTarget = document.getElementById("cmdTarget");
    const cmdBtn = document.getElementById("cmdBtn");
    const replyDrawer = document.getElementById("replyDrawer");
    const replyMeta = document.getElementById("replyMeta");
    const replyText = document.getElementById("replyText");

    cmdForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const prompt = cmdInput.value.trim();
      const target = cmdTarget.value;
      if (!prompt) return;

      cmdBtn.disabled = true;
      cmdBtn.textContent = "Memproses...";
      const guessedRole = target === "auto"
        ? (/(caption|artikel|blog|seo|konten|promo|iklan|marketing|deskripsi)/i.test(prompt) ? "writer" : "coder")
        : target;

      triggerOwnerToCeo(guessedRole);

      try {
        const res = await fetch("/api/office/command", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ prompt, target }),
        });
        const data = await res.json();
        if (!res.ok || !data.ok) throw new Error(data.error || "Gagal menjalankan perintah");

        const role = data.role || guessedRole;
        agents[role].lastTask = prompt;
        const rHt = agents[role].el.querySelector(".ht-task");
        if (rHt) rHt.textContent = prompt;
        const oHt = ownerLabel.querySelector(".ht-task");
        if (oHt) oHt.textContent = prompt;
        triggerTaskComplete(role);

        replyMeta.textContent = `CEO → ${role.toUpperCase()} (${data.provider}/${data.model})`;
        replyText.textContent = data.reply || "(Kosong)";
        replyDrawer.classList.add("open");
        cmdInput.value = "";
        pollOfficeState();
      } catch (err) {
        replyMeta.textContent = "Error";
        replyText.textContent = err.message || "Gagal";
        replyDrawer.classList.add("open");
      } finally {
        cmdBtn.disabled = false;
        cmdBtn.textContent = "Kirim Misi";
        setTimeout(() => {
          for (const k of ["ceo", "coder", "writer"]) {
            agents[k].state = "idle";
            agents[k].el.classList.remove("working");
          }
        }, 2000);
      }
    });

    const clock = new THREE.Clock();
    const projVec = new THREE.Vector3();

    function projectToScreen(vec3, el) {
      projVec.copy(vec3).project(camera);
      if (projVec.z > 1) { el.style.display = "none"; return; }
      el.style.display = "inline-flex";
      el.style.left = `${(projVec.x * 0.5 + 0.5) * window.innerWidth}px`;
      el.style.top = `${(-projVec.y * 0.5 + 0.5) * window.innerHeight}px`;
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      for (const su of screenUpdaters) su.draw(t, su.getWorking(), su.getDone ? su.getDone() : false);
      leds.forEach((led, idx) => {
        led.material.color.setHex(Math.sin(t * 3.5 + idx * 1.1) > 0 ? 0x34d399 : 0x065f46);
      });

      // Smooth interpolation for character animations & glow
      for (const a of Object.values(agents)) {
        const targetIntensity = a.state === "working" ? 1 : (a.state === "active" ? 0.35 : 0);
        a.animIntensity += (targetIntensity - a.animIntensity) * 0.08;

        const bobAmp = 0.012 + a.animIntensity * 0.018;
        const bobFreq = 2.0 + a.animIntensity * 7.5;
        a.head.position.y = 1.54 + Math.sin(t * bobFreq) * bobAmp;

        const nowMs = performance.now();
        const isCelebrating = (a.celebratingUntil || 0) > nowMs;
        const isDelegating = (a.delegatingUntil || 0) > nowMs;
        const targetStandY = isDelegating ? 0.18 : 0;
        a.charGroup.position.y += (targetStandY - a.charGroup.position.y) * 0.16;

        if (isCelebrating) {
          a.leftArm.rotation.x += (-2.2 - a.leftArm.rotation.x) * 0.18;
          a.rightArm.rotation.x += (-2.2 - a.rightArm.rotation.x) * 0.18;
          a.head.position.y = 1.54 + Math.abs(Math.sin(t * 7)) * 0.04;
        } else if (isDelegating) {
          a.rightArm.rotation.x += (-1.15 - a.rightArm.rotation.x) * 0.2;
          a.leftArm.rotation.x += (0.15 - a.leftArm.rotation.x) * 0.2;
        } else {
          const armAmp = 0.03 + a.animIntensity * 0.2;
          const armFreq = 2.0 + a.animIntensity * 11.0;
          a.leftArm.rotation.x += ((0.2 + Math.sin(t * armFreq) * armAmp) - a.leftArm.rotation.x) * 0.2;
          a.rightArm.rotation.x += ((0.2 + Math.cos(t * armFreq) * armAmp) - a.rightArm.rotation.x) * 0.2;
        }

        if (typeof a.lookTargetY === "number") {
          a.charGroup.rotation.y += (a.lookTargetY - a.charGroup.rotation.y) * 0.12;
        }
        a.ring.material.opacity = 0.24 + a.animIntensity * 0.55;
        a.monitor.material.emissiveIntensity = 0.32 + a.animIntensity * 0.52;
        projectToScreen(a.anchor, a.el);
      }

      const ownerDelegating = ownerAnim.delegatingUntil > performance.now();
      ownerChar.position.y += ((ownerDelegating ? 0.22 : 0) - ownerChar.position.y) * 0.16;
      ownerHead.position.y = 1.54 + Math.sin(t * 2.0) * 0.012;
      if (ownerDelegating) {
        ownerRightArm.rotation.x += (-1.2 - ownerRightArm.rotation.x) * 0.22;
        ownerLeftArm.rotation.x += (0.15 - ownerLeftArm.rotation.x) * 0.2;
      } else {
        ownerLeftArm.rotation.x += ((0.2 + Math.sin(t * 2.2) * 0.03) - ownerLeftArm.rotation.x) * 0.18;
        ownerRightArm.rotation.x += ((0.2 + Math.cos(t * 2.2) * 0.03) - ownerRightArm.rotation.x) * 0.18;
      }
      projectToScreen(new THREE.Vector3(0, 2.55, 5.25), ownerLabel);

      for (let i = packets.length - 1; i >= 0; i--) {
        const p = packets[i];
        p.t += 0.022;
        if (p.t >= 1) {
          spawnPulseRing(p.toVec, p.colorHex || 0x38bdf8);
          scene.remove(p.orb);
          packets.splice(i, 1);
          continue;
        }
        const ease = p.t * p.t * (3 - 2 * p.t);
        p.orb.position.lerpVectors(p.from, p.to, ease);
        p.orb.position.y += Math.sin(ease * Math.PI) * 1.45;
        p.orb.rotation.y += 0.08;
        p.orb.rotation.x = Math.sin(ease * Math.PI) * 0.25;
      }

      for (let i = beams.length - 1; i >= 0; i--) {
        const b = beams[i];
        b.t += 0.016;
        if (b.t >= 1) {
          scene.remove(b.mesh);
          b.mesh.geometry.dispose();
          b.mat.dispose();
          beams.splice(i, 1);
          continue;
        }
        b.mat.opacity = (1 - b.t) * 0.72;
      }

      for (let i = pulses.length - 1; i >= 0; i--) {
        const pr = pulses[i];
        pr.t += 0.03;
        if (pr.t >= 1) {
          scene.remove(pr.ring);
          pulses.splice(i, 1);
          continue;
        }
        const scale = 1 + pr.t * 3.2;
        pr.ring.scale.set(scale, scale, 1);
        pr.ring.material.opacity = (1 - pr.t) * 0.85;
      }

      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
