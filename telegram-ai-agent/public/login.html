<!doctype html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Masuk · TH Agent</title><link rel="stylesheet" href="/style.css"></head><body class="login-page"><main class="login-card"><div class="login-brand"><img src="/logo.png" alt="TH Agent"><div><strong>TH Agent</strong><span>Web Settings</span></div></div><h1>Selamat datang</h1><p class="login-subtitle">Masuk untuk membuka Control Panel TH Agent.</p><form id="loginForm"><label>Username<input id="username" autocomplete="username" required value="admin"></label><label>Password<input id="password" type="password" autocomplete="current-password" required autofocus></label><button type="submit" class="btn btn-primary">Masuk ke Web Settings</button><p id="loginError" class="login-error" role="alert"></p></form></main><script>const form=document.getElementById('loginForm'),userInput=document.getElementById('username'),passInput=document.getElementById('password'),error=document.getElementById('loginError');form.addEventListener('submit',async e=>{e.preventDefault();error.textContent='';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/auth/login',{method:'POST',cache:'no-store',headers:{'Content-Type':'application/json'},body:JSON.stringify({username:userInput.value.trim(),password:passInput.value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(d.error||'Login gagal');window.location.assign('/')}catch(e){error.textContent=e.message||'Login gagal'}finally{button.disabled=false}});</script></body></html>
